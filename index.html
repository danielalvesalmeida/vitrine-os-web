<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<title>vitrine-os · captura</title>
</head>
<body>
<header><strong>vitrine-os</strong><span id="loja-nome"></span><button id="btn-sair" class="link" hidden>Sair</button></header>
<main>
  <section id="tela-carregando"><p>Carregando…</p></section>

  <section id="tela-login" hidden>
    <h1>Entrar</h1>
    <p>Receba um link de acesso no seu e-mail. Só entra quem foi convidado pelo admin.</p>
    <label>E-mail <input id="login-email" type="email" autocomplete="email" inputmode="email"></label>
    <button id="btn-login" class="primario">Enviar link</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="tela-lojas" hidden>
    <h1>Escolha a loja</h1>
    <div id="lista-lojas" class="lista"></div>
  </section>

  <section id="tela-home" hidden>
    <button id="btn-novo" class="primario grande">+ Nova máquina</button>
    <h2>Recentes</h2>
    <div id="lista-itens" class="lista"></div>
  </section>

  <section id="tela-novo" hidden>
    <h1>Nova máquina</h1>
    <label>Tipo <select id="novo-perfil"></select></label>
    <label>SKU <input id="novo-sku" autocapitalize="characters"></label>
    <label>Custo de compra (R$) <input id="novo-custo" type="number" inputmode="decimal" min="0" step="0.01" placeholder="opcional"></label>
    <button id="btn-criar" class="primario">Começar fotos</button>
    <button id="btn-cancelar-novo" class="link">Cancelar</button>
    <p id="novo-msg" class="msg"></p>
  </section>

  <section id="tela-captura" hidden>
    <p class="passo"><span id="cap-passo"></span> · <span id="cap-sku"></span></p>
    <h1 id="cap-rotulo"></h1>
    <p id="cap-papel" class="sub"></p>
    <img id="cap-preview" alt="" hidden>
    <label class="primario grande" id="lbl-foto">Tirar foto
      <input id="cap-input" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <div class="linha">
      <button id="btn-pular" class="link">Pular este passo</button>
      <button id="btn-terminar" class="link">Terminar</button>
    </div>
    <p id="cap-msg" class="msg"></p>
    <div id="cap-fila" class="sub"></div>
  </section>

  <section id="tela-fim" hidden>
    <h1>Fotos enviadas</h1>
    <p id="fim-resumo"></p>
    <button id="btn-reenviar" class="primario" hidden>Reenviar as que falharam</button>
    <button id="btn-voltar" class="primario">Voltar ao estoque</button>
  </section>
</main>
<script src="config.js"></script>
<script src="vendor/supabase-2.119.2.js"></script>
<script src="app.js"></script>
</body>
</html>
